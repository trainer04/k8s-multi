# vCluster configuration for Core Banking team
# Using minimal configuration compatible with latest vCluster

# Control plane configuration
controlPlane:
  # CoreDNS inside vCluster
  coredns:
    enabled: true

  # Backing store configuration
  backingStore:
    etcd:
      embedded:
        enabled: true

# Sync configuration (new schema)
sync:
  toHost:
    pods:
      enabled: true