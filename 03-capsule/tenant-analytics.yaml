apiVersion: capsule.clastix.io/v1beta2
kind: Tenant
metadata:
  name: analytics
spec:
  owners:
  - name: analytics-team
    kind: Group

  namespaceOptions:
    quota: 3

  resourceQuotas:
    scope: Tenant
    items:
    - hard:
        limits.cpu: "32"
        limits.memory: "128Gi"
        requests.cpu: "16"
        requests.memory: "64Gi"
        pods: "50"

  limitRanges:
    items:
    - limits:
      - max:
          cpu: "16"
          memory: "64Gi"
        min:
          cpu: "100m"
          memory: "128Mi"
        default:
          cpu: "1"
          memory: "2Gi"
        defaultRequest:
          cpu: "500m"
          memory: "1Gi"
        type: Container

  storageClasses:
    allowed:
    - fast-ssd

  nodeSelector:
    workload: analytics

  networkPolicies:
    items:
    - policyTypes:
      - Ingress
      - Egress
      ingress:
      - from:
        - namespaceSelector:
            matchLabels:
              capsule.clastix.io/tenant: analytics
      egress:
      - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        ports:
        - protocol: UDP
          port: 53
      - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
            - 10.0.0.0/8
